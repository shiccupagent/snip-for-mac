name: Build Snip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Speedrun timer tests
        run: bash scripts/test_speedrun.sh

      - name: Compile (Apple Silicon + Intel)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Import signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: bash scripts/import_cert.sh

      - name: Package Snip.app, Snip.dmg
        run: bash scripts/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Snip
          path: |
            dist/Snip.dmg
            dist/Snip.zip

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Snip.dmg dist/Snip.zip \
            --title "Snip (latest build)" \
            --target "${{ github.sha }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download **Snip.dmg**, open it and drag Snip into Applications. First launch: see the README (macOS will ask you to approve an app from outside the App Store)."
